name: SonicMD

options:
  bundleIdPrefix: com.andrea70031
  deploymentTarget:
    iOS: "17.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.4.0

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SonicMD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SonicMD
    resources:
      - path: SonicMD/Assets.xcassets
      - path: SonicMD/PrivacyInfo.xcprivacy
    dependencies:
      - package: GoogleMobileAds
    info:
      path: SonicMD/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrea70031.sonicmd
        PRODUCT_NAME: SonicMD
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
