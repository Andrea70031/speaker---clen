name: SonicMD

options:
  bundleIdPrefix: com.andrea70031
  deploymentTarget:
    iOS: "17.0"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.4.0

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  SonicMD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SonicMD/AcousticEngine.swift
      - path: SonicMD/AdMobBannerView.swift
      - path: SonicMD/ContentView.swift
      - path: SonicMD/PrivacyView.swift
      - path: SonicMD/QuickGuideView.swift
      - path: SonicMD/SessionHistory.swift
      - path: SonicMD/SonicMDApp.swift
      - path: SonicMD/TermsView.swift
    resources:
      - path: SonicMD/Assets.xcassets
      - path: SonicMD/PrivacyInfo.xcprivacy
    dependencies:
      - package: GoogleMobileAds
    info:
      path: SonicMD/Info.plist
      properties:
        CFBundleDisplayName: "Sonic MD"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Sonic MD usa il microfono per confrontare localmente la risposta acustica dell'altoparlante prima e dopo una sessione. L'audio non viene inviato a server esterni."
        GADApplicationIdentifier: "ca-app-pub-2013766674591751~6839959210"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrea70031.sonicmd
        PRODUCT_NAME: SonicMD
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
