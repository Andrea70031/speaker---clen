name: SonicMD

options:
  bundleIdPrefix: com.sonicmd
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"

targets:
  SonicMD:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SonicMD
    info:
      path: SonicMD/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonicmd.prototype
        PRODUCT_NAME: SonicMD
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
