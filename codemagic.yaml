workflows:
  ios-compile-check:
    name: Sonic MD - iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          xcodebuild -project SonicMD.xcodeproj -list

      - name: Build unsigned simulator app
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild build             -project SonicMD.xcodeproj             -scheme SonicMD             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -configuration Debug             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             | tee /tmp/sonicmd-xcodebuild.log

    artifacts:
      - /tmp/sonicmd-xcodebuild.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/**
