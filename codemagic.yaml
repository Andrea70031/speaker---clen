workflows:
  ios-compile-check:
    name: Sonic MD - iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version
      - name: List project schemes
        script: |
          xcodebuild -project "$CM_BUILD_DIR/SonicMD.xcodeproj" -list
      - name: Build unsigned iOS Simulator app
        script: |
          set -o pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/SonicMD.xcodeproj" \
            -scheme "SonicMD" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/sonicmd-xcodebuild.log
    artifacts:
      - /tmp/sonicmd-xcodebuild.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/**
