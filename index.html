<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sonic MD</title><style>
:root{--b:#070a10;--p:#121824cc;--t:#f6f8ff;--m:#8e9bb0;--a:#6676ff;--c:#38d9ff}html.light{--b:#eef3f8;--p:#ffffffc9;--t:#101723;--m:#667286}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#27325c,var(--b) 42%);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,Arial;min-height:100vh}.app{max-width:540px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:2px;font-weight:800}.gear,.tile,.mode{border:1px solid #ffffff18;background:var(--p);color:var(--t)}.gear{width:42px;height:42px;border-radius:14px}.hero{text-align:center}.hero h1{font-size:38px;margin:30px 0 4px}.hero p,.note{color:var(--m)}.orb{width:210px;height:210px;margin:24px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c),var(--a),#a45cff,var(--c));box-shadow:0 0 65px #6676ff66;position:relative}.orb:before{content:"";position:absolute;inset:8px;background:var(--b);border-radius:50%}.orb.run{animation:s .45s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.score{z-index:1}.score b{display:block;font-size:52px}.score span{font-size:10px;color:var(--m);letter-spacing:1px}.panel{background:var(--p);border:1px solid #ffffff18;border-radius:25px;padding:18px;margin:12px 0;backdrop-filter:blur(18px)}.row{display:flex;gap:8px}.metric{flex:1;padding:12px;border:1px solid #ffffff18;border-radius:16px}.metric small{display:block;color:var(--m);font-size:10px}.primary{width:100%;padding:18px;border:0;border-radius:19px;background:linear-gradient(135deg,var(--c),var(--a));color:#fff;font-size:18px;font-weight:800}.progress{height:7px;background:#ffffff16;border-radius:8px;margin:14px 0;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--a));transition:.2s}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{text-align:left;border-radius:21px;padding:16px;min-height:105px}.tile b{display:block;margin-top:16px}.tile small{color:var(--m)}.settings{display:none}.settings.open{display:block}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mode{padding:11px;border-radius:12px}.mode.on{background:var(--t);color:var(--b)}</style></head><body><main class="app">
<div class="top"><div class="brand">SONIC MD • PROTOTYPE</div><button id="gear" class="gear">⚙︎</button></div>
<div id="settings" class="settings panel"><b>Aspetto</b><p class="note">Automatico segue il tema iPhone.</p><div class="modes"><button data-th="auto" class="mode on">Auto</button><button data-th="light" class="mode">Chiaro</button><button data-th="dark" class="mode">Scuro</button></div></div>
<section class="hero"><h1>Speaker Health</h1><p>Fingerprint acustico personale</p><div id="orb" class="orb"><div class="score"><b id="score">--</b><span>LOCAL INDEX</span></div></div></section>
<div class="panel"><div class="row"><div class="metric"><small>STATO</small><strong id="state">Non analizzato</strong></div><div class="metric"><small>SESSIONE</small><strong id="session">Pronta</strong></div></div><div class="progress"><div id="bar" class="bar"></div></div><p id="log" class="note">Avvia Smart Scan.</p><button id="scan" class="primary">◉ SMART SCAN</button></div>
<div class="grid"><button id="water" class="tile">💧<b>Water Rescue</b><small>Impulsi bassi progressivi</small></button><button id="dust" class="tile">◌<b>Dust Rescue</b><small>Burst rapidi</small></button><button id="adaptive" class="tile">⌁<b>Adaptive Clean</b><small>Sequenza dinamica</small></button><button id="finger" class="tile">◎<b>Fingerprint</b><small>Salva riferimento</small></button></div>
</main><script>
let ctx,run=false,last=null,base=+localStorage.sonicBase||0;const $=x=>document.getElementById(x),orb=$("orb"),bar=$("bar");
async function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume()}
function tone(f,ms,v=.65){let o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+ms/1000);o.connect(g);g.connect(ctx.destination);o.start();o.stop(n+ms/1000+.02)}
async function seq(a,ms,p,name){if(run)return;await audio();run=true;orb.classList.add("run");$("session").textContent=name;let i=0;function go(){if(i>=a.length){run=false;orb.classList.remove("run");bar.style.width="100%";$("log").textContent=name+" completata.";return}tone(a[i++],ms);bar.style.width=i/a.length*100+"%";setTimeout(go,ms+p)}go()}
$("water").onclick=()=>seq([165,155,145,135,125,115,105,120,140,160],240,55,"Water Rescue");
$("dust").onclick=()=>seq([120,210,145,240,130,190,110,225,155,200,125,250],110,25,"Dust Rescue");
$("adaptive").onclick=()=>seq([110,140,180,220,250,205,165,125,235,150,195,115,245],140,35,"Adaptive Clean");
$("scan").onclick=async()=>{if(run)return;await audio();run=true;orb.classList.add("run");$("state").textContent="Analisi";let a=[180,250,350,500,700,900,1200,1600,2200],i=0;function go(){if(i>=a.length){run=false;orb.classList.remove("run");last=base?Math.round(base+Math.random()*4-2):Math.round(82+Math.random()*7);$("score").textContent=last;$("state").textContent="Fingerprint pronto";$("log").textContent="Indice locale prototipo: non è una diagnosi hardware.";return}tone(a[i++],140,.32);bar.style.width=i/a.length*100+"%";setTimeout(go,200)}go()};
$("finger").onclick=()=>{if(!last){$("log").textContent="Esegui prima Smart Scan.";return}base=last;localStorage.sonicBase=base;$("log").textContent="Fingerprint salvato sul dispositivo."};
function theme(v){localStorage.sonicTheme=v;let l=v==="light"||(v==="auto"&&matchMedia("(prefers-color-scheme:light)").matches);document.documentElement.classList.toggle("light",l);document.querySelectorAll("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th===v))}theme(localStorage.sonicTheme||"auto");$("gear").onclick=()=>$("settings").classList.toggle("open");document.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>theme(b.dataset.th));
</script></body></html>
