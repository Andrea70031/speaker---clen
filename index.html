<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Speaker Clean</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#243958,#111722 35%,#07090d 78%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 20px 30px;text-align:center}h1{font-size:36px;margin:0}.sub{color:#aeb8c7}.card{padding:28px 20px 22px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff1a}.speaker{width:165px;height:165px;margin:25px auto;border-radius:50%;background:radial-gradient(circle,#08090c 0 16%,#293449 17% 26%,#080a0e 27% 56%,#283348 57% 66%,#050609 67%);box-shadow:0 0 55px #4b80ff3d}.speaker.cleaning{animation:p .12s infinite alternate}.speaker.bursting{animation:p .08s infinite alternate}@keyframes p{to{transform:scale(1.06);box-shadow:0 0 85px #7658ffcc}}.status{font-size:18px;font-weight:700}.timer{font-size:46px;font-weight:800;margin:8px 0 22px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}button{border:0;color:#fff;font-weight:700}.mode,.small{padding:14px 5px;border-radius:15px;background:#1d2534}.mode.active{background:#fff;color:#080a0e}.main{width:100%;padding:20px;border-radius:22px;background:linear-gradient(135deg,#4d8cff,#805bff);font-size:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.note{color:#919db0;font-size:13px;line-height:1.5;margin-top:20px}
</style></head><body><div class="app"><h1>Speaker Clean</h1><p class="sub">Impulsi audio per altoparlanti iPhone</p><div class="card"><div id="speaker" class="speaker"></div><div id="status" class="status">Pronto</div><div id="timer" class="timer">00:15</div><div class="modes"><button class="mode" data-mode="soft">Soft</button><button class="mode active" data-mode="normal">Normal</button><button class="mode" data-mode="power">Power</button><button class="mode" data-mode="burst">Burst</button></div><button id="main" class="main">▶ Avvia pulizia</button><div class="controls"><button id="test" class="small">🔊 Test</button><button id="reset" class="small">↺ Reset</button></div></div><p class="note">Alza il volume gradualmente e tieni gli altoparlanti rivolti verso il basso. Interrompi in caso di distorsioni anomale.</p></div>
<script>
let ctx=null,running=false,mode="normal",left=15,tick=null,pulse=null;
const cfg={soft:{d:20,v:.35,l:260,p:120,f:[150,170,140,180]},normal:{d:15,v:.62,l:210,p:70,f:[130,170,210,145,190]},power:{d:15,v:.82,l:170,p:45,f:[115,150,200,230,130,185]},burst:{d:10,v:.95,l:110,p:25,f:[105,130,165,210,250,145,190,120]}};
const sp=document.getElementById("speaker"),st=document.getElementById("status"),tm=document.getElementById("timer"),main=document.getElementById("main");
function show(){tm.textContent="00:"+String(Math.max(left,0)).padStart(2,"0")}async function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state!=="running")await ctx.resume()}
function stop(){running=false;clearInterval(tick);clearTimeout(pulse);sp.classList.remove("cleaning","bursting");st.textContent="Pronto";main.textContent="▶ Avvia pulizia";left=cfg[mode].d;show()}
function hit(f,v,ms){const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime,d=ms/1000;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.012);g.gain.setValueAtTime(v,n+Math.max(d-.045,.02));g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+d+.02)}
function loop(){if(!running)return;let c=cfg[mode];hit(c.f[Math.floor(Math.random()*c.f.length)],c.v,c.l);pulse=setTimeout(loop,c.l+c.p)}
async function start(){await audio();running=true;let c=cfg[mode];left=c.d;show();sp.classList.add(mode==="burst"?"bursting":"cleaning");st.textContent=mode==="burst"?"BURST CLEAN":"Pulizia in corso";main.textContent="■ Ferma";loop();tick=setInterval(()=>{left--;show();if(left<=0)stop()},1000)}
main.onclick=()=>running?stop():start();document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{if(running)return;document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;left=cfg[mode].d;show();st.textContent=mode==="burst"?"Modalità Burst":"Pronto"});document.getElementById("reset").onclick=stop;document.getElementById("test").onclick=async()=>{await audio();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;g.gain.value=.4;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),800)};show();
</script></body></html>
